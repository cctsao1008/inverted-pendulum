<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid control mode transitions</title>
  <desc id="desc">Control state transitions between swing-up, transition, and stabilization modes for a rotary inverted pendulum.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="550" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111111" text-anchor="middle">
    <rect x="230" y="20" width="300" height="90" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.5"/>
    <text x="380" y="60" font-size="21">SWING-UP</text>
    <text x="380" y="86" font-size="19">Energy-based control</text>

    <rect x="230" y="220" width="300" height="90" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.5"/>
    <text x="380" y="260" font-size="21">TRANSITION</text>
    <text x="380" y="286" font-size="19">Controller handover</text>

    <rect x="230" y="430" width="300" height="90" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.5"/>
    <text x="380" y="470" font-size="21">STABILIZATION</text>
    <text x="380" y="496" font-size="19">PD/PID, LQR, or LQI</text>
  </g>

  <g fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M300 110 C205 145, 155 190, 230 240"/>
    <path d="M450 220 C535 175, 520 135, 430 110"/>
    <path d="M300 310 C185 355, 165 405, 290 430"/>
    <path d="M470 430 C515 385, 515 345, 450 310"/>
    <path d="M530 475 C690 425, 690 145, 530 72"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111">
    <rect x="22" y="145" width="208" height="30" fill="#ffffff"/>
    <text x="28" y="166">Enter stabilization region</text>

    <rect x="388" y="145" width="236" height="30" fill="#ffffff"/>
    <text x="394" y="166">Exit stabilization region</text>

    <rect x="28" y="352" width="225" height="52" fill="#ffffff"/>
    <text x="34" y="373">Stabilization conditions</text>
    <text x="34" y="395">met</text>

    <rect x="470" y="352" width="155" height="30" fill="#ffffff"/>
    <text x="476" y="373">Large deviation</text>

    <rect x="602" y="262" width="135" height="30" fill="#ffffff"/>
    <text x="608" y="283">Fall detected</text>
  </g>
</svg>
